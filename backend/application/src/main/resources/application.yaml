spring:
  application:
    name: erasure
  datasource:
    url: ${DATABASE_URL}
    username: erasure_runtime
    password: ${DATABASE_RUNTIME_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  flyway:
    url: ${DATABASE_URL}
    user: erasure_migrator
    password: ${DATABASE_MIGRATION_PASSWORD}
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/demo
    placeholders:
      demoIssuer: ${OIDC_ISSUER}
server:
  servlet:
    session:
      cookie:
        secure: false
