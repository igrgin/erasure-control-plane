name: Issue policy
on:
  workflow_run:
    workflows: [Planning integrity]
    types: [completed]
  issues:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write
concurrency:
  group: issue-policy-${{ github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: false
jobs:
  policy:
    name: Refresh issue policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check issue, branch, and prerequisite acceptance
        run: python3 scripts/github_policy.py
        env:
          GH_TOKEN: ${{ github.token }}
