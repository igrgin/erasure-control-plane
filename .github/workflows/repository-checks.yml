name: Repository checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: bash scripts/check-accounts.sh
      - name: Capture service diagnostics on failure
        if: failure()
        run: docker compose -f deploy/local/compose.yaml logs --no-color --tail=150
      - name: Stop acceptance environment
        if: always()
        run: docker compose -f deploy/local/compose.yaml down
