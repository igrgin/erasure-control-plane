name: erasure-demo-sources
x-postgres: &postgres
  image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
  profiles: [sources]
  networks: [sources]
  mem_limit: 256m
  cpus: 1
  command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U demo_admin -d "$${POSTGRES_DB}"']
    interval: 2s
    timeout: 3s
    retries: 60
services:
  fulfillment:
    <<: *postgres
    environment:
      POSTGRES_USER: demo_admin
      POSTGRES_DB: demo_fulfillment
      POSTGRES_PASSWORD_FILE: /run/secrets/fulfillment_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [fulfillment_password]
    volumes: [fulfillment-data:/var/lib/postgresql/data]
  support:
    <<: *postgres
    environment:
      POSTGRES_USER: demo_admin
      POSTGRES_DB: demo_support
      POSTGRES_PASSWORD_FILE: /run/secrets/support_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [support_password]
    volumes: [support-data:/var/lib/postgresql/data]
  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5@sha256:38604132e9d6cf4cd0acc090b3de645361dc142384e5341338aecb863741c630
    profiles: [sources]
    networks: [sources]
    mem_limit: 1536m
    cpus: 2
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      xpack.ml.enabled: 'false'
      node.store.allow_mmap: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    secrets: [search_password, search_curl]
    command: [bash, /demo/search-entrypoint.sh]
    volumes:
      - search-data:/usr/share/elasticsearch/data
      - ../../demo/sources/search-entrypoint.sh:/demo/search-entrypoint.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS --config /run/secrets/search_curl "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s" >/dev/null']
      interval: 3s
      timeout: 4s
      retries: 60
networks:
  sources:
    internal: true
volumes:
  fulfillment-data:
  support-data:
  search-data:
secrets:
  fulfillment_password:
    file: .local/fulfillment_password
  support_password:
    file: .local/support_password
  search_password:
    file: .local/search_password
  search_curl:
    file: .local/search_curl
