name: erasure-accounts
services:
  postgres:
    mem_limit: 512m
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_PASSWORD: local-bootstrap-only
    volumes:
      - accounts-db:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/01-accounts.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    mem_limit: 768m
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: local-keycloak-only
      KC_HOSTNAME: http://localhost:18113
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:18113:8080"]
    volumes:
      - ./realm.json:/opt/keycloak/data/import/erasure.json:ro
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"HTTP/1.1 200\" <&3'"]
      interval: 3s
      timeout: 3s
      start_period: 60s
      retries: 30
    depends_on:
      postgres: {condition: service_healthy}
  application:
    mem_limit: 512m
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/erasure
      DATABASE_RUNTIME_PASSWORD: local-runtime-only
      DATABASE_MIGRATION_PASSWORD: local-migrator-only
      DATABASE_POOL_SIZE: 1
      OIDC_CLIENT_SECRET: local-oidc-only
      OIDC_ISSUER: http://localhost:18113/realms/erasure
      OIDC_BACKCHANNEL_URL: http://keycloak:8080/realms/erasure
      APP_BASE_URL: http://localhost:18112
    ports: ["127.0.0.1:18112:8080"]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"HTTP/1.1 200\" <&3'"]
      interval: 3s
      timeout: 3s
      start_period: 45s
      retries: 30
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
volumes:
  accounts-db:
